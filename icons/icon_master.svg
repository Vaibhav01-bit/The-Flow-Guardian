<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1a3a1a"/>
      <stop offset="100%" stop-color="#071207"/>
    </radialGradient>
    <linearGradient id="leafGrad" x1="20%" y1="5%" x2="80%" y2="95%">
      <stop offset="0%" stop-color="#b2f5cb"/>
      <stop offset="50%" stop-color="#68d391"/>
      <stop offset="100%" stop-color="#276749"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b2f5ea"/>
      <stop offset="100%" stop-color="#4fd1c5"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#68d391" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4fd1c5" stop-opacity="0.5"/>
    </linearGradient>
    <filter id="leafGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="waveGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark green circle background -->
  <circle cx="64" cy="64" r="64" fill="url(#bgGrad)"/>

  <!-- Subtle inner ambient glow -->
  <ellipse cx="64" cy="58" rx="38" ry="35" fill="#68d391" fill-opacity="0.06"/>

  <!-- Decorative outer ring arc -->
  <circle cx="64" cy="64" r="58"
    fill="none"
    stroke="url(#ringGrad)"
    stroke-width="1.5"
    stroke-dasharray="220 145"
    stroke-linecap="round"
    transform="rotate(-120 64 64)"/>

  <!-- ── Leaf: a pointed teardrop rotated 15deg, tip at top-right ── -->
  <!-- The leaf is built from a natural leaf outline using cubic bezier -->
  <g filter="url(#leafGlow)">
    <!-- Leaf outline: starts at tip (top), curves out left and right to base (bottom) -->
    <path
      d="M 64,20
         C 90,22 96,46 88,62
         C 80,78 68,84 64,88
         C 60,84 48,78 40,62
         C 32,46 38,22 64,20 Z"
      fill="url(#leafGrad)"
    />

    <!-- Highlight sheen (top-left of leaf) -->
    <ellipse cx="55" cy="36" rx="7" ry="12"
      fill="white" fill-opacity="0.15"
      transform="rotate(-20 55 36)"/>
  </g>

  <!-- Central vein (teal, slightly transparent) -->
  <line x1="64" y1="24" x2="64" y2="84"
    stroke="url(#tealGrad)" stroke-width="2" stroke-linecap="round" opacity="0.75"
    filter="url(#waveGlow)"/>

  <!-- Left veins -->
  <path d="M 64,44 Q 52,47 46,55" fill="none"
    stroke="#81e6d9" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
  <path d="M 64,56 Q 50,59 44,67" fill="none"
    stroke="#81e6d9" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>

  <!-- Right veins -->
  <path d="M 64,44 Q 76,47 82,55" fill="none"
    stroke="#81e6d9" stroke-width="1.4" stroke-linecap="round" opacity="0.55"/>
  <path d="M 64,56 Q 78,59 84,67" fill="none"
    stroke="#81e6d9" stroke-width="1.2" stroke-linecap="round" opacity="0.45"/>

  <!-- ── Stem ── -->
  <path d="M 64,88 Q 62,96 60,100" fill="none"
    stroke="#68d391" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>

  <!-- ── Flow wave below (wellness / pulse motif) ── -->
  <path d="M 30,108 Q 38,102 46,108 Q 54,114 62,108 Q 70,102 78,108 Q 86,114 94,108 Q 100,102 98,108"
    fill="none"
    stroke="url(#tealGrad)"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.6"
    filter="url(#waveGlow)"/>

  <!-- Corner accent dots -->
  <circle cx="25" cy="30" r="2" fill="#68d391" opacity="0.3"/>
  <circle cx="103" cy="30" r="2" fill="#4fd1c5" opacity="0.3"/>
  <circle cx="25" cy="98" r="1.5" fill="#68d391" opacity="0.25"/>
  <circle cx="103" cy="98" r="1.5" fill="#4fd1c5" opacity="0.25"/>

  <!-- Final border ring -->
  <circle cx="64" cy="64" r="63" fill="none" stroke="#68d391" stroke-width="0.75" stroke-opacity="0.2"/>
</svg>
