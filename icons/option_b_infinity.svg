<!-- Option B: Flowing infinity loop / wave (Flow motif) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="bgB" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#163316"/>
      <stop offset="100%" stop-color="#050d05"/>
    </radialGradient>
    <linearGradient id="loopGradB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a8edbc"/>
      <stop offset="50%" stop-color="#68d391"/>
      <stop offset="100%" stop-color="#4fd1c5"/>
    </linearGradient>
    <filter id="loopGlowB" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ringGlowB" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="64" cy="64" r="64" fill="url(#bgB)"/>

  <!-- Ambient glow rings -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="#68d391" stroke-width="18" stroke-opacity="0.04"/>

  <!-- Outer decorative arc -->
  <circle cx="64" cy="64" r="57" fill="none" stroke="url(#loopGradB)"
    stroke-width="1.5" stroke-opacity="0.35"
    stroke-dasharray="180 178" stroke-linecap="round"
    transform="rotate(-100 64 64)"/>

  <!-- ∞ Infinity / figure-8 / flow symbol -->
  <g filter="url(#loopGlowB)">
    <!-- Left lobe -->
    <circle cx="44" cy="64" r="20" fill="none" stroke="url(#loopGradB)" stroke-width="7" stroke-opacity="0.9"/>
    <!-- Right lobe -->
    <circle cx="84" cy="64" r="20" fill="none" stroke="url(#loopGradB)" stroke-width="7" stroke-opacity="0.9"/>
    <!-- Cover the inner junction to make a clean figure-8 -->
    <rect x="52" y="50" width="24" height="28" fill="url(#bgB)" opacity="0.95"/>
    <!-- Redraw crossover lines cleanly -->
    <!-- left-to-right crossing strokes -->
    <path d="M 52,52 Q 64,64 76,76" fill="none" stroke="url(#loopGradB)" stroke-width="7" stroke-linecap="round"/>
    <path d="M 52,76 Q 64,64 76,52" fill="none" stroke="url(#loopGradB)" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Center node dot -->
  <circle cx="64" cy="64" r="5" fill="#b2f5ea" opacity="0.9" filter="url(#ringGlowB)"/>

  <!-- Pulse circles -->
  <circle cx="64" cy="64" r="28" fill="none" stroke="#68d391" stroke-width="0.8" stroke-opacity="0.18"/>
  <circle cx="64" cy="64" r="48" fill="none" stroke="#4fd1c5" stroke-width="0.8" stroke-opacity="0.12"/>

  <!-- Corner dots -->
  <circle cx="20" cy="20" r="2"   fill="#68d391" opacity="0.3"/>
  <circle cx="108" cy="20" r="2"  fill="#4fd1c5" opacity="0.3"/>
  <circle cx="64" cy="120" r="2"  fill="#68d391" opacity="0.25"/>

  <!-- Border -->
  <circle cx="64" cy="64" r="63" fill="none" stroke="#68d391" stroke-width="0.8" stroke-opacity="0.18"/>
</svg>
